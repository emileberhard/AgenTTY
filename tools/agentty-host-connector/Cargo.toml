[package]
build = "../../scripts/rust-build-identity.rs"
license-file = "../../LICENSE"
name = "agentty-host-connector"
version = "0.0.0"
edition = "2024"
description = "Persistent AgenTTY SSH relay connector."

[dependencies]
anyhow = "1.0.100"
futures-util = "0.3.31"
reqwest = { version = "0.12.24", default-features = false, features = ["http2", "json", "rustls-tls-native-roots"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
