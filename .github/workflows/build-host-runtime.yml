name: Host runtime

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/build-host-runtime.yml
      - .github/workflows/build-tmux-runtime.yml
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  tmux:
    uses: ./.github/workflows/build-tmux-runtime.yml

  package:
    needs: tmux
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      MARKETING_VERSION: ${{ inputs.version || '0.0.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: brew install just

      - name: Install the pinned Zig
        env:
          ZIG_VERSION: 0.17.0
          ZIG_SHA256: b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/$ZIG_VERSION/zig-aarch64-macos-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | shasum -a 256 -c
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-macos-$ZIG_VERSION" >> "$GITHUB_PATH"

      - name: Build host runtime
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTTY_GH_CLI: gh
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          scripts/ensure-notify-helper-toolchain --install-missing
          just sync-tmux-runtime "$GITHUB_RUN_ID"
          just build-notify-helper
          just build-host-connector
          scripts/package-release-runtime
          (cd .local/release-runtime && shasum -a 256 -c SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-runtime
          path: .local/release-runtime
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
