version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns: ["*"]
    cooldown:
      default-days: 1
  - package-ecosystem: cargo
    directories: [/services/backend, /tools/agentty-notify, /tools/agentty-host-connector]
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns: ["*"]
    cooldown:
      default-days: 1
  - package-ecosystem: bun
    directories: [/tools/agentty-host, /AppStoreScreenshots]
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns: ["*"]
    cooldown:
      default-days: 1
