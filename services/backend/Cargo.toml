[package]
name = "agentty-backend"
version = "0.0.0"
edition = "2024"
description = "Minimal AgenTTY backend service."

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["json", "macros", "multipart", "tokio", "ws"] }
base64 = "0.23.1"
futures-util = "0.3.34"
hex = "0.4.3"
http = "1.5.0"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
openssl = "=0.10.81"
x509-parser = "=0.18.1"
rand = "0.10.3"
reqwest = { version = "0.12.28", default-features = false, features = ["http2", "json", "rustls-tls-native-roots", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tokio-rusqlite = "0.8.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
