[package]
name = "agentty-backend"
version = "0.0.0"
edition = "2024"
description = "Minimal AgenTTY backend service."

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.4", features = ["json", "macros", "tokio", "ws"] }
base64 = "0.23.1"
futures-util = "0.3.31"
hex = "0.4.3"
http = "1.3.1"
httpdate = "1.0.3"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
openssl = "=0.10.81"
x509-parser = "=0.18.1"
rand = "0.10.2"
reqwest = { version = "0.12.24", default-features = false, features = ["http2", "json", "multipart", "rustls-tls-native-roots"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tokio-rusqlite = "0.7.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }
