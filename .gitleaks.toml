[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Pinned Ghostty artifact SHA-256 checksums"
condition = "AND"
paths = ['''(^|/)scripts/ghostty-artifact\.json$''']
regexes = ['''^[0-9a-f]{64}$''']

[[rules.allowlists]]
description = "Published cryptographic vectors and synthetic APNs fixtures"
condition = "AND"
paths = ['''(^|/)services/backend/tests/activity_transport\.rs$''']
regexes = [
    '''^abcdef0123456789$''',
]

[[rules.allowlists]]
description = "Published cryptographic vectors and synthetic APNs fixtures"
condition = "AND"
paths = ['''(^|/)services/backend/tests/api\.rs$''']
regexes = [
    '''^abcdef0123456789$''',
]

[[rules.allowlists]]
description = "Published cryptographic vectors and synthetic APNs fixtures"
condition = "AND"
paths = ['''(^|/)AgenTTY/Tests/SSHKeyImportDecryptionTests\.swift$''']
regexes = [
    '''^0db3ac94b3ee53284f4a22893b3c24ae$''',
]

