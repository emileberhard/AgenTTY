name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config zsh
      - run: cargo test --locked --manifest-path services/backend/Cargo.toml
      - run: cargo test --locked --manifest-path tools/agentty-notify/Cargo.toml
      - run: cargo test --locked --manifest-path tools/agentty-host-connector/Cargo.toml
      - run: ./scripts/test-host-shell-path

  host-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm install --global bun@1.4.3
      - run: bun install --frozen-lockfile && bun run test && bun run build
        working-directory: tools/agentty-host

  release-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/tests -v

  ios-tests:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/select-xcode
      - run: scripts/ios-public test

  ios-archive:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/select-xcode
      - name: Archive the release configuration unsigned
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/AgenTTY.xcarchive
        run: scripts/ios-public archive
      - name: Remove build output
        if: always()
        run: rm -rf "${{ runner.temp }}/AgenTTY.xcarchive"
