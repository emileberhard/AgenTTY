name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config zsh
      - run: cargo test --locked --manifest-path services/backend/Cargo.toml
      - run: cargo test --locked --manifest-path tools/agentty-notify/Cargo.toml
      - run: cargo test --locked --manifest-path tools/agentty-host-connector/Cargo.toml
      - run: ./scripts/test-host-shell-path

  host-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: npm install --global bun@1.4.3
      - run: bun install --frozen-lockfile && bun run test && bun run build
        working-directory: tools/agentty-host

  ios:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          brew tap tuist/tuist
          brew trust --tap tuist/tuist
          brew install just tuist/tuist/tuist@4.212.0
      - run: echo "$(brew --prefix tuist/tuist/tuist@4.212.0)/bin" >> "$GITHUB_PATH"
      - run: just ios-test
