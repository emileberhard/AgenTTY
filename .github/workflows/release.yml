name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Original release run containing the built npm candidate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  guard:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release ref
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/check-release-tag "$VERSION"

  check:
    needs: guard
    uses: ./.github/workflows/ci.yml

  tmux:
    needs: check
    uses: ./.github/workflows/build-tmux-runtime.yml

  npm-candidate:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: npm install --global bun@1.4.3
      - name: Build the tagged pairing package
        working-directory: tools/agentty-host
        run: |
          bun install --frozen-lockfile
          npm version "$VERSION" --no-git-tag-version
          npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-candidate
          path: tools/agentty-host/*.tgz
          if-no-files-found: error
          retention-days: 3

  build:
    needs: [check, tmux, npm-candidate]
    if: github.event_name == 'push'
    permissions:
      contents: read
      actions: read
    runs-on: xcode-27
    environment: testflight
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      MARKETING_VERSION: ${{ github.ref_name }}
      DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
      AGENTTY_BUNDLE_ID: ${{ vars.AGENTTY_BUNDLE_ID }}
      AGENTTY_APP_GROUP: ${{ vars.AGENTTY_APP_GROUP }}
      AGENTTY_CLOUDKIT_CONTAINER: ${{ vars.AGENTTY_CLOUDKIT_CONTAINER }}
      AGENTTY_KEYCHAIN_NAMESPACE: ${{ vars.AGENTTY_KEYCHAIN_NAMESPACE }}
      AGENTTY_UNLOCK_PRODUCT_ID: ${{ vars.AGENTTY_UNLOCK_PRODUCT_ID }}
      AGENTTY_RELAY_URL: ${{ vars.AGENTTY_RELAY_URL }}
      AGENTTY_ARTIFACT_URL: ${{ vars.AGENTTY_ARTIFACT_URL }}
      AGENTTY_RELEASE_ARTIFACT_URL: https://github.com/${{ github.repository }}/releases/download
      AGENTTY_SENTRY_DSN: ${{ vars.AGENTTY_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure official build
        env:
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          ./scripts/configure-hosted-release
          ./scripts/check-build-identity
          plutil -insert teamID -string "$DEVELOPMENT_TEAM" Config/ExportOptions.plist
          export APP_STORE_CONNECT_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$APP_STORE_CONNECT_KEY_PATH"' EXIT
          umask 077
          printf '%s' "$APP_STORE_CONNECT_KEY_P8" > "$APP_STORE_CONNECT_KEY_PATH"
          ./scripts/check-release-version "$MARKETING_VERSION"
      - run: |
          brew tap tuist/tuist
          brew trust --tap tuist/tuist
          brew install just tuist/tuist/tuist@4.212.0
      - run: echo "$(brew --prefix tuist/tuist/tuist@4.212.0)/bin" >> "$GITHUB_PATH"
      - name: Build host runtime
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTTY_GH_CLI: gh
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          ./scripts/ensure-notify-helper-toolchain --install-missing
          just tmux-runtime-sync "$GITHUB_RUN_ID"
          just notify-helper-rebuild
          just host-connector-rebuild
          ./scripts/package-release-runtime
      - run: just ios-cloud-archive
      - name: Preserve complete candidate
        run: tar -czf build/release-candidate.tar.gz -C build AgenTTY.xcarchive release-runtime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: build/release-candidate.tar.gz
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: xcode-27
    environment: testflight
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      MARKETING_VERSION: ${{ github.ref_name }}
      DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
      AGENTTY_BUNDLE_ID: ${{ vars.AGENTTY_BUNDLE_ID }}
      AGENTTY_APP_GROUP: ${{ vars.AGENTTY_APP_GROUP }}
      AGENTTY_CLOUDKIT_CONTAINER: ${{ vars.AGENTTY_CLOUDKIT_CONTAINER }}
      AGENTTY_KEYCHAIN_NAMESPACE: ${{ vars.AGENTTY_KEYCHAIN_NAMESPACE }}
      AGENTTY_UNLOCK_PRODUCT_ID: ${{ vars.AGENTTY_UNLOCK_PRODUCT_ID }}
      AGENTTY_RELAY_URL: ${{ vars.AGENTTY_RELAY_URL }}
      AGENTTY_ARTIFACT_URL: ${{ vars.AGENTTY_ARTIFACT_URL }}
      AGENTTY_RELEASE_ARTIFACT_URL: https://github.com/${{ github.repository }}/releases/download
      AGENTTY_SENTRY_DSN: ${{ vars.AGENTTY_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : "${RUNNER_TEMP:?}"
          mkdir -p build
          mkdir "$RUNNER_TEMP/agentty-release-candidate"
          trap 'rm -rf "$RUNNER_TEMP/agentty-release-candidate"' EXIT
          gh run download "$GITHUB_RUN_ID" --name release-candidate --dir "$RUNNER_TEMP/agentty-release-candidate"
          tar -xzf "$RUNNER_TEMP/agentty-release-candidate/release-candidate.tar.gz" -C "$RUNNER_TEMP/agentty-release-candidate" AgenTTY.xcarchive release-runtime
          mv "$RUNNER_TEMP/agentty-release-candidate/AgenTTY.xcarchive" "$RUNNER_TEMP/agentty-release-candidate/release-runtime" build/
          (cd build/release-runtime && shasum -a 256 -c SHA256SUMS)
          ./scripts/configure-hosted-release
          plutil -insert teamID -string "$DEVELOPMENT_TEAM" Config/ExportOptions.plist
      - run: brew install just
      - run: npm install --global @sentry/cli@3.8.1
      - name: Upload Sentry symbols
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          sentry-cli releases new "$MARKETING_VERSION"
          sentry-cli debug-files upload --include-sources build/AgenTTY.xcarchive/dSYMs
          sentry-cli releases finalize "$MARKETING_VERSION"
      - name: Stage complete runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/release-notes "$MARKETING_VERSION" > build/release-notes.md
          gh release create "$MARKETING_VERSION" --draft --verify-tag --title "$MARKETING_VERSION" --notes-file build/release-notes.md
          touch build/created-release-draft
          gh release upload "$MARKETING_VERSION" build/release-runtime/*
      - name: Sign and upload
        env:
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          export APP_STORE_CONNECT_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$APP_STORE_CONNECT_KEY_PATH"' EXIT
          umask 077
          printf '%s' "$APP_STORE_CONNECT_KEY_P8" > "$APP_STORE_CONNECT_KEY_PATH"
          ./scripts/check-release-version "$MARKETING_VERSION"
          just ios-cloud-export
      - name: Publish runtime after successful TestFlight upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$MARKETING_VERSION" --draft=false
      - name: Remove an unpublished draft after failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -f build/created-release-draft && $(gh release view "$MARKETING_VERSION" --json isDraft --jq .isDraft) == true ]]; then
            gh release delete "$MARKETING_VERSION" --yes
          fi

  npm:
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag')) }}
    runs-on: ubuntu-24.04
    environment: testflight
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.ref_name }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id || github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Restore the built pairing package
        run: |
          ./scripts/check-release-tag "$VERSION"
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > release-run.json
          python3 - "$VERSION" "$(git rev-parse HEAD)" <<'PY'
          import json
          import sys
          run = json.load(open("release-run.json"))
          expected = {"event": "push", "path": ".github/workflows/release.yml", "head_branch": sys.argv[1], "head_sha": sys.argv[2]}
          if any(run.get(key) != value for key, value in expected.items()):
              raise SystemExit("npm candidate must come from this tag's release run")
          PY
          [[ "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" == false ]]
          gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name npm-candidate --dir package
      - name: Publish with npm OIDC and provenance
        run: |
          node -e 'if (+process.versions.node.split(".")[0] < 22) process.exit(1)'
          npm install --global npm@11.6.2
          npm publish ./package/*.tgz --provenance --access public --ignore-scripts
