[package]
build = "../../scripts/rust-build-identity.rs"
license-file = "../../LICENSE"
name = "agentty-host-connector"
version = "0.0.0"
edition = "2024"
description = "Persistent AgenTTY SSH relay connector."

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
reqwest = { version = "0.12.28", default-features = false, features = ["http2", "json", "rustls-tls-native-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
