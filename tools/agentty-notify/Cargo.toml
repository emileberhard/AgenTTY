[package]
build = "../../scripts/rust-build-identity.rs"
license-file = "../../LICENSE"
name = "agentty-notify"
version = "0.0.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"] }
toml = "1.1.8"
