[package]
build = "../../scripts/rust-build-identity.rs"
license-file = "../../LICENSE"
name = "agentty-notify"
version = "0.0.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12.14", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
time = { version = "0.3.41", features = ["formatting", "local-offset", "macros"] }
toml = "0.8.23"
